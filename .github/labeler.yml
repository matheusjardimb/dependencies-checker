repo:
  - changed-files:
      - any-glob-to-any-file: '*'
source:
  - changed-files:
      - any-glob-to-any-file: src/**/*
action:
  - changed-files:
      - any-glob-to-any-file: action.yml
tests:
  - changed-files:
      - any-glob-to-any-file: tests/**/*
automation:
  - changed-files:
      - any-glob-to-any-file: .github/workflows/*
docs:
  - changed-files:
      - any-glob-to-any-file: '*.md'
