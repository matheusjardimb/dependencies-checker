name: 'publish-action'
on:
  release:
    types: [ created ]
  repository_dispatch:
    types: [ actions-package-migrate ]

permissions:
  contents: read

jobs:
  package-and-publish: # make sure the action works on a clean machine without building
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checking out!
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.client_payload.release.tag_name }}

      - name: Publish action
        uses: actions-on-packages/package-action@25cad5e17dbfa79fcc93a681090df1be1eed50f2 # 0.5.0