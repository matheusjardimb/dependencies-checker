name: 'Dependencies Checker'
description: 'Validates whether a project uses version-specific dependencies only'
author: 'Matheus Jardim Bernardes'

branding:
  color: "green"
  icon: "check-circle"

inputs:
  packageJsonPath:
    description: 'Path of the package.json file to be evaluated. Accepts several paths or glob patterns, one per line.'
    required: false
    default: 'package.json'
  quiet:
    description: 'Reduces the amount of logs printed during evaluation.'
    required: false
    default: false

runs:
  using: 'node24'
  main: 'dist/index.js'
